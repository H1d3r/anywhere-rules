name: Update Hub catalog

on:
  push:
    branches: [main]
    paths:
      - "mitm/**"
      - "rules/common/**"
      - "scripts/build_hub_catalog.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Hub catalog
        run: python3 scripts/build_hub_catalog.py

      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hub
          if git diff --cached --quiet; then
            echo "Hub catalog is current."
          else
            git commit -m "Update Hub catalog"
            git push
          fi
